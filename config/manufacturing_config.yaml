defaults:
  currency: "USD"

manufacturing_processes:
  cnc:
    # Setup costs and process-specific pricing (from desired_architecture.md spec)
    setup_price: 50.00
    machine_hourly_rate: 80.00

    # Process limitations and constraints
    constraints:
      min_tool_radius_mm: 3.0
      default_axis: "Z"
      mrr_mm3_per_min: 1000.0 # Material Removal Rate for standard aluminum milling

    # Process parameters
    parameters:
      finishing_feed_rate_mm_min: 500.0
      finishing_stepover_mm: 0.5

  injection_molding:
    # Setup costs and process-specific pricing
    base_mold_cost: 5000.00
    mold_cost_per_surface_area_cm2: 0.50
    machine_hourly_rate: 60.00

    # Process limitations and constraints
    constraints:
      min_draft_angle_deg: 2.0
      min_wall_thickness_mm: 1.0
      max_wall_thickness_mm: 4.0

    # Process parameters
    parameters:
      injection_rate_cm3_s: 10.0

materials:
  aluminum_6061:
    # Physical properties (for simulation and randomization)
    density_g_cm3: 2.7
    density_kg_m3: 2700
    color: "#C0C0C0"
    restitution: 0.5 # Coefficient of restitution (bounciness)
    friction_coef: 0.61 # Approximate static friction against steel

    # Material costs
    cost_per_kg: 6.00

  steel_carbon:
    density_g_cm3: 7.85
    density_kg_m3: 7850
    color: "#6E737B"
    restitution: 0.55
    friction_coef: 0.60
    cost_per_kg: 1.80

  steel_structural:
    density_g_cm3: 7.85
    density_kg_m3: 7850
    color: "#5F666E"
    restitution: 0.50
    friction_coef: 0.62
    cost_per_kg: 1.40

  abs:
    # Physical properties
    density_g_cm3: 1.04
    density_kg_m3: 1040
    color: "#FFFFFF"
    restitution: 0.6
    friction_coef: 0.5

    # Material costs
    cost_per_kg: 2.50

  hdpe:
    density_g_cm3: 0.95
    density_kg_m3: 950
    color: "#F1F5F9"
    restitution: 0.30
    friction_coef: 0.22
    cost_per_kg: 1.90

  hardwood:
    density_g_cm3: 0.75
    density_kg_m3: 750
    color: "#8B5A2B"
    restitution: 0.35
    friction_coef: 0.50
    cost_per_kg: 3.20

  silicone_rubber:
    density_g_cm3: 1.1
    density_kg_m3: 1100
    color: "#FF0000"
    restitution: 0.1
    friction_coef: 0.8
    cost_per_kg: 15.00

  rubber_generic:
    density_g_cm3: 1.15
    density_kg_m3: 1150
    color: "#1F2937"
    restitution: 0.20
    friction_coef: 0.90
    cost_per_kg: 8.50
