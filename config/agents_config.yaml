      - read_file
      - inspect_media
      - write_file
      - edit_file
      - grep
      - execute_command
      - inspect_topology
    allowed_during_unit_eval:
      - benchmark_coder
      - benchmark_reviewer
    visual_inspection:
      required: true
      min_images: 1
      reminder_interval: 2
  engineer_plan_reviewer:
