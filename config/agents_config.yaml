          - engineering_plan.md
          - benchmark_plan.md
          - todo.md
          - benchmark_definition.yaml
          - benchmark_assembly_definition.yaml
          - assembly_definition.yaml
          - payload_trajectory_definition.yaml
          - plan_refusal.md
