version: "1.0"
llm:
  max_reasoning_tokens: 16384
  context_compaction_threshold_tokens: 225000
  requests_per_minute: 40
  multimodal_model: null
  reasoning_effort_enabled: true
render:
  image_resolution:
    width: 1024
    height: 768
  video_resolution:
    width: 1280
    height: 960
  split_video_renders_to_images: true
  video_frame_attachment_stride: 6
  video_frame_jpeg_quality_percent: 85
  rgb:
    enabled: true
    axes: true
    edges: true
  depth:
    enabled: true
    axes: true
    edges: true
  segmentation:
    enabled: true
    axes: true
    edges: true
  handoff_rgb_payload_path_overlay:
    enabled: true
execution:
  defaults:
    timeout_seconds: 300
    max_turns: 150
    max_total_tokens: 400000
    native_tool_loop_max_iters: 8
  agents:
    engineer_planner:
      timeout_seconds: 450
      max_turns: 150
      max_total_tokens: 400000
      native_tool_loop_max_iters: 48
    engineer_coder:
      timeout_seconds: 1000
      max_turns: 150
      max_total_tokens: 400000
      native_tool_loop_max_iters: 48
    engineer_plan_reviewer:
      timeout_seconds: 90
      max_turns: 150
      max_total_tokens: 400000
    engineer_execution_reviewer:
      timeout_seconds: 90
      max_turns: 150
      max_total_tokens: 400000
    benchmark_planner:
      timeout_seconds: 450
      max_turns: 150
      max_total_tokens: 400000
      native_tool_loop_max_iters: 48
    benchmark_coder:
      timeout_seconds: 450
      max_turns: 150
      max_total_tokens: 400000
      native_tool_loop_max_iters: 48
    benchmark_reviewer:
      timeout_seconds: 90
      max_turns: 150
      max_total_tokens: 400000
    journalling_agent:
      timeout_seconds: 90
      max_turns: 150
      max_total_tokens: 400000
bug_reports:
  enabled: true
  archive_root: logs/bug_reports
motion_forecast:
  benchmark_planner:
    sample_stride_s: 2.0
    position_tolerance_mm: [6.0, 6.0, 6.0]
    rotation_tolerance_deg: [0.1, 0.1, 15.0]
  engineer_planner:
    sample_stride_s: 0.5
    position_tolerance_mm: [1.2, 1.2, 1.2]
    rotation_tolerance_deg: [0.1, 0.1, 5.0]
  engineer_coder:
    sample_stride_s: 0.3
    position_tolerance_mm: [0.6, 0.6, 0.6]
    rotation_tolerance_deg: [0.1, 0.1, 2.0]
payload_trajectory_clearance:
  enabled: true
  max_orientation_cells: 96
  max_recursion_depth: 6
  max_exact_checks: 9
  leaf_span_deg: [2.0, 2.0, 2.0]
payload_trajectory_monitor:
  enabled: true
  monitor_sample_stride_s: 0.3
  consecutive_miss_count: 2
benchmark_payload_observation:
  window_s: 1.5
defaults:
  reasoning_effort: high
  filesystem_permissions:
    read:
      allow:
        - "**"
        - /
        - .
      deny:
        - .git/**
        - .env
        - "**/secrets/**"
        - .manifests/**
    write:
      allow: []
      deny:
        - "**"
agents:
  engineer_planner:
    reasoning_effort: xhigh
    filesystem_permissions:
      read:
        allow:
          - /
          - .
          - config/**
          - .agents/skills/**
          - utils/**
          - manufacturing_config.yaml
          - benchmark_definition.yaml
          - benchmark_assembly_definition.yaml
          - assembly_definition.yaml
          - benchmark_plan_evidence_script.py
          - solution_plan_evidence_script.py
          - payload_trajectory_definition.yaml
          - engineering_plan.md
          - benchmark_plan.md
          - todo.md
          - journal.md
          - renders/**
        deny:
          - .manifests/**
      write:
        allow:
          - engineering_plan.md
          - benchmark_plan.md
          - todo.md
          - journal.md
          - assembly_definition.yaml
          - benchmark_definition.yaml
          - renders/engineer_plan_renders/**
          - renders/current-episode/**
          - benchmark_plan_evidence_script.py
          - solution_plan_evidence_script.py
      deny:
        - .agents/skills/**
        - utils/**
        - reviews/**
        - benchmark_script.py
        - solution_script.py
        - payload_trajectory_definition.yaml
        - .manifests/**
    tools:
      - list_files
      - read_file
      - inspect_media
      - write_file
      - edit_file
      - validate_costing_and_price
      - submit_engineering_plan
    allowed_during_unit_eval:
      - engineer_planner
      - engineer_plan_reviewer
    visual_inspection:
      required: true
      min_images: 1
      reminder_interval: 2
  engineer_coder:
    reasoning_effort: high
    filesystem_permissions:
      read:
        allow:
          - /
          - .
          - config/**
          - .agents/skills/**
          - utils/**
          - engineering_plan.md
          - benchmark_plan.md
          - todo.md
          - journal.md
          - benchmark_definition.yaml
          - benchmark_assembly_definition.yaml
          - assembly_definition.yaml
          - benchmark_script.py
          - solution_script.py
          - payload_trajectory_definition.yaml
          - "**/*.py"
          - reviews/**
          - renders/**
        deny:
          - .manifests/**
      write:
        allow:
          - solution_script.py
          - "**/*.py"
          - todo.md
          - journal.md
          - renders/current-episode/**
          - plan_refusal.md
          - payload_trajectory_definition.yaml
          - engineering_plan.md
          - benchmark_plan.md
          - assembly_definition.yaml
          - reviews/engineering-plan-review-decision-round-*.yaml
          - reviews/engineering-plan-review-comments-round-*.yaml
      deny:
        - .agents/skills/**
        - utils/**
        - benchmark_script.py
        - reviews/**/*.py
        - .manifests/**
    tools:
      - list_files
      - read_file
      - inspect_media
      - write_file
      - edit_file
      - grep
      - execute_command
      - inspect_topology
    allowed_during_unit_eval:
      - engineer_coder
      - engineer_execution_reviewer
    visual_inspection:
      required: true
      min_images: 1
      reminder_interval: 2
  benchmark_coder:
    reasoning_effort: high
    filesystem_permissions:
      read:
        allow:
          - /
          - .
          - .agents/skills/**
          - utils/**
          - benchmark_plan.md
          - todo.md
          - journal.md
          - benchmark_definition.yaml
          - benchmark_assembly_definition.yaml
          - benchmark_script.py
          - "**/*.py"
          - plan_refusal.md
          - reviews/**
          - renders/**
          - validation_results.json
          - simulation_result.json
          - scene.json
          - assets/**
        deny:
          - .manifests/**
      write:
        allow:
          - benchmark_script.py
          - "**/*.py"
          - todo.md
          - journal.md
          - renders/current-episode/**
          - plan_refusal.md
        deny:
