repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, "--select=E9,F,I"]
        files: \.py$
        exclude: ^(tests/integration/mock_responses/|shared/assets/template_repos/)
      - id: ruff-format
        files: \.py$
        exclude: ^(tests/integration/mock_responses/|shared/assets/template_repos/)
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.0.10
  - repo: local
    hooks:
      - id: precommit-backup
        name: precommit-backup
        entry: python3 scripts/precommit_backup.py
        language: system
        pass_filenames: false
        always_run: true
