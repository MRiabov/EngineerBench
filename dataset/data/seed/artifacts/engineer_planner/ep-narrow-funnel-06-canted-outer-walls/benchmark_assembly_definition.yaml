dfm_suggestions:
  - Keep the canted wall segments static and clearly stepped so the narrowing funnel is easy to inspect.
  - Keep the throat frame legible even though it is slightly skewed, and do not hide the opening inside the frame.
  - Use a simple planar start pad and goal pad so the rotated mouth, not the landing surfaces, is the planning challenge.
